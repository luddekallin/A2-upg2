<link rel="stylesheet" href="output.css" />
<div class="filter">

   <button id="closeButton" type="button" aria-label="Close filter-challenges">
        <span></span>
        <span></span>
    </button>

  <nav class="filter-nav">
    <h1 class="filter-navtitle">Filter challenges</h1>

    <div class="filter-columns">
      <div class="filter-navtype">
        <h2>By type</h2>
        <ul>
          <li><input type="checkbox" /> Include online challenges</li>
          <li><input type="checkbox" /> Include on-site challenges</li>
        </ul>
      </div>

      <div class="filter-navrating">
        <h2>By rating</h2>
        <div class="rating-wrapper">
    <div id="min-stars" class="star-rating"></div>
          <p>to</p>
   <div id="max-stars" class="star-rating"></div>
        </div>
      </div>
      
      <div class="filter-navtags">
        <h2>By tags</h2>
        <button class="tags">Web</button>
        <button class="tags">Linux</button>
        <button class="tags">Cryptography</button>
        <button class="tags">Coding</button>
        <button class="tags">Some other tag</button>
        <button class="tags">A final tag</button>
      </div>
    </div>

    <div class="filter-navsearch">
      <h3>Or type to search for keyword</h2>
      <input type="text" placeholder="Start typing to filter" />
    </div>
  </nav>
</div>
<script src="challenges.js"></script>
